<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curso de Colorimetría</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
        }
        .hero {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('fondo-barberia.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero-content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #ffcc00;
        }
        .hero-content p {
            font-size: 1.2rem;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .cta-button {
            display: inline-block;
            padding: 15px 30px;
            background-color: #00cc66;
            color: white;
            text-decoration: none;
            font-size: 1.2rem;
            border-radius: 5px;
            font-weight: bold;
        }
        .cta-button:hover {
            background-color: #00994d;
        }
    </style>
</head>
<body>
    <header class="hero">
        <div class="hero-content">
            <h1>Domina la Colorimetría Avanzada</h1>
            <p>Transforma tus cortes con técnicas de nivel profesional. Más de 50 videos paso a paso.</p>
            <a href="#" class="cta-button">¡Inscríbete Ahora!</a>
        </div>
    </header>
</body>
</html>
